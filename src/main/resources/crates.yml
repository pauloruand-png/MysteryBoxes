# ========================================================
#       MysteryBoxes - Definição de Caixas e Recompensas
# ========================================================
#
# Formato de cada recompensa:
#   chance: porcentagem/peso da recompensa na roleta
#   display:
#     material: MATERIAL (Item exibido na roleta e na prévia)
#     amount: quantidade exibida
#     name: "Nome Colorido"
#     lore:
#       - "Linha de descrição 1"
#     enchantments:
#       - "ENCHANTMENT_NAME:LEVEL"
#     glowing: true/false (brilho de encantamento)
#   items: (Itens físicos que o jogador receberá)
#     - material: MATERIAL
#       amount: quantidade
#       name: "Nome Personalizado"
#       enchantments:
#         - "SHARPNESS:5"
#   commands: (Comandos executados pelo console - placeholder %player%)
#     - "eco give %player% 5000"
#   broadcast: true/false (anunciar no servidor caso ganhe esta recompensa)
#   broadcast-message: "&eO jogador &f%player% &eabriu uma &6Caixa &ee tirou &b%reward%&e!"

crates:
  comum:
    name: "&a&lCaixa Comum"
    key:
      material: TRIPWIRE_HOOK
      name: "&a&lChave Comum"
      lore:
        - "&7Use esta chave para abrir"
        - "&7uma &aCaixa Comum&7!"
        - ""
        - "&eClique com o botão direito"
        - "&ena caixa para abrir."
      glowing: true
    rewards:
      ferro:
        chance: 35.0
        display:
          material: IRON_INGOT
          amount: 16
          name: "&f16x Barra de Ferro"
        items:
          - material: IRON_INGOT
            amount: 16
      ouro:
